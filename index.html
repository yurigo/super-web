
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3 en Raya</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="#inicio" aria-label="Arcadia, inicio">
            <span class="brand-mark" aria-hidden="true">A</span>
            <span>arcadia</span>
        </a>
        <nav class="main-nav" aria-label="Navegación principal">
            <a class="nav-link active" href="#inicio" aria-current="page">Inicio</a>
            <a class="nav-link" href="#juego">Juegos</a>
            <a class="nav-link" href="#juego">Favoritos</a>
        </nav>
        <div class="profile" aria-label="Perfil de jugador">
            <span class="profile-avatar" aria-hidden="true">J</span>
            <span class="profile-name">Jugador</span>
        </div>
    </header>

    <main class="page-shell" id="inicio">
        <section class="game-section" id="juego" aria-labelledby="game-title">
            <div class="page-heading">
                <p class="eyebrow"><span class="availability-dot"></span> JUEGO DESTACADO</p>
                <h1 id="game-title">3 en raya</h1>
                <p class="subtitle">El clásico juego de estrategia</p>
            </div>

            <div class="game-card">
                <div class="scoreboard" aria-label="Marcador">
                    <div class="score active" id="scoreX">
                        <span class="symbol">X</span>
                        <span>Jugador 1</span>
                        <strong id="winsX">0</strong>
                    </div>

                    <div class="score" id="scoreO">
                        <span class="symbol">O</span>
                        <span>Jugador 2</span>
                        <strong id="winsO">0</strong>
                    </div>
                </div>

                <div class="status" id="status" role="status" aria-live="polite">
                    Turno del jugador X
                </div>

                <div class="board" id="board" role="group" aria-label="Tablero de 3 en raya">
                    <button class="cell" data-index="0" aria-label="Casilla 1, vacía"></button>
                    <button class="cell" data-index="1" aria-label="Casilla 2, vacía"></button>
                    <button class="cell" data-index="2" aria-label="Casilla 3, vacía"></button>
                    <button class="cell" data-index="3" aria-label="Casilla 4, vacía"></button>
                    <button class="cell" data-index="4" aria-label="Casilla 5, vacía"></button>
                    <button class="cell" data-index="5" aria-label="Casilla 6, vacía"></button>
                    <button class="cell" data-index="6" aria-label="Casilla 7, vacía"></button>
                    <button class="cell" data-index="7" aria-label="Casilla 8, vacía"></button>
                    <button class="cell" data-index="8" aria-label="Casilla 9, vacía"></button>
                </div>

                <button class="reset" id="reset">
                    <span aria-hidden="true">↻</span> Nueva partida
                </button>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <span>arcadia</span>
        <span>Un espacio para jugar.</span>
    </footer>

    <script src="script.js"></script>
</body>
</html>
